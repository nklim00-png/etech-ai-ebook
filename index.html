<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
  <title>㈜이테크시스템 | AI 팩토리 디지털 브로슈어 (e-Book)</title>
  <style>
    :root {
      --bg: #060C1A;
      --card: #0D192E;
      --cyan: #00BCEB;
      --mint: #00E5A3;
      --text: #F1F5F9;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: rgba(13, 25, 46, 0.95);
      border-bottom: 2px solid var(--cyan);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { font-size: 14px; font-weight: 800; color: #fff; }
    .brand span { color: var(--cyan); font-weight: 600; margin-left: 6px; font-size: 12px; }
    .dl-btn {
      background: linear-gradient(135deg, #049FD9, #00BCEB);
      color: #060C1A;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0, 188, 235, 0.35);
    }
    .viewer-wrap {
      width: 100%;
      max-width: 720px;
      padding: 16px 12px 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-indicator {
      font-size: 13px;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
    }
    .book-frame {
      width: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1E3A5F;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      background: #0D192E;
    }
    .book-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .book-slider::-webkit-scrollbar { display: none; }
    .book-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .book-slide img {
      width: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .nav-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 25, 46, 0.94);
      border: 1px solid #1E3A5F;
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      display: flex;
      gap: 14px;
      align-items: center;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .slide-arrow {
      background: transparent;
      border: none;
      color: var(--cyan);
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      padding: 2px 6px;
      cursor: pointer;
    }
    .slide-arrow:disabled { opacity: 0.25; cursor: default; }
    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #334E7B;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dot.active {
      width: 24px;
      background: var(--cyan);
    }
    .swipe-hint {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }
    /* Modal */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 16, 0.82);
      backdrop-filter: blur(4px);
      z-index: 50;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1.5px solid var(--cyan);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .modal h2 { font-size: 18px; margin-bottom: 6px; color: #fff; }
    .modal p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.45; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--cyan); font-weight: 700; margin-bottom: 5px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2A4A7F;
      background: #071020;
      color: #fff;
      font-size: 14px;
    }
    .submit-btn {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #049FD9, #00E5A3);
      color: #060C1A;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }
    .close-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .confirm-badge {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: rgba(0, 229, 163, 0.16);
      border: 1.5px solid var(--mint);
      color: var(--mint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      margin: 0 auto 12px;
    }
    .confirm-title { text-align: center; }
    .confirm-desc { text-align: center; }
    .confirm-box {
      background: #071020;
      border: 1px solid #1E3A5F;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .confirm-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(30, 58, 95, 0.5);
    }
    .confirm-row:last-child { border-bottom: none; }
    .confirm-key { color: var(--cyan); font-weight: 700; flex-shrink: 0; }
    .confirm-val { color: #fff; text-align: right; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div class="brand">㈜이테크시스템 <span>Cisco 공식 파트너</span></div>
    <button class="dl-btn" onclick="openModal()">PDF 다운로드</button>
  </header>

  <div class="viewer-wrap">
    <div class="page-indicator" id="pageLabel">1 / 2 페이지 (표지 · 핵심 가치) — 좌우로 슬라이드하세요</div>
    <div class="book-frame">
      <div class="book-slider" id="bookSlider">
        <div class="book-slide">
          <img src="page1.png" alt="브로슈어 1페이지 (표지 · 핵심 가치)" />
        </div>
        <div class="book-slide">
          <img src="page2.png" alt="브로슈어 2페이지 (세부 기술 사양표)" />
        </div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <button class="slide-arrow" id="prevBtn" onclick="goSlide(0)" aria-label="이전 페이지" disabled>‹</button>
    <div class="dots">
      <button class="dot active" id="dot0" onclick="goSlide(0)" aria-label="1페이지"></button>
      <button class="dot" id="dot1" onclick="goSlide(1)" aria-label="2페이지"></button>
    </div>
    <span class="swipe-hint" id="swipeHint">1 / 2 · 좌우 슬라이드</span>
    <button class="slide-arrow" id="nextBtn" onclick="goSlide(1)" aria-label="다음 페이지">›</button>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>브로슈어 PDF 다운로드</h2>
      <p>방문 정보를 입력해 주시면 추가 기술 자료를 보내드립니다.<br>(입력 없이 빈칸 상태로도 바로 다운로드 가능합니다)</p>
      <form id="leadForm" name="brochure-leads" method="POST" data-netlify="true" netlify onsubmit="submitLead(event)">
        <input type="hidden" name="form-name" value="brochure-leads" />
        <div class="field">
          <label>성함 (선택)</label>
          <input type="text" id="vName" name="name" placeholder="예: 홍길동" />
        </div>
        <div class="field">
          <label>소속 기관 / 기업명 (선택)</label>
          <input type="text" id="vOrg" name="org" placeholder="예: 한전KDN" />
        </div>
        <div class="field">
          <label>연락처 또는 이메일 (선택)</label>
          <input type="text" id="vContact" name="contact" placeholder="예: 010-1234-5678 / email@company.kr" />
        </div>
        <button type="submit" class="submit-btn" id="subBtn">PDF 브로슈어 바로 다운로드</button>
        <button type="button" class="close-btn" onclick="closeModal()">닫기</button>
      </form>
    </div>
  </div>

  <div class="modal-bg" id="confirmModalBg" onclick="if(event.target===this) closeConfirmModal()">
    <div class="modal">
      <div class="confirm-badge">✓</div>
      <h2 class="confirm-title" id="confirmTitle">접수 및 다운로드 완료</h2>
      <p class="confirm-desc" id="confirmDesc">입력하신 정보가 정상 접수되었으며, PDF 브로슈어 다운로드가 시작되었습니다.</p>
      <div class="confirm-box" id="confirmBox">
        <div class="confirm-row"><span class="confirm-key">성함</span><span class="confirm-val" id="cfName">-</span></div>
        <div class="confirm-row"><span class="confirm-key">소속</span><span class="confirm-val" id="cfOrg">-</span></div>
        <div class="confirm-row"><span class="confirm-key">연락처</span><span class="confirm-val" id="cfContact">-</span></div>
        <div class="confirm-row"><span class="confirm-key">확인 시각</span><span class="confirm-val" id="cfTime">-</span></div>
      </div>
      <button type="button" class="close-btn" onclick="triggerPdfDownload()">PDF가 안 받아지면 다시 다운로드</button>
    </div>
  </div>

  <script>
    const slider = document.getElementById('bookSlider');
    const pageLabel = document.getElementById('pageLabel');
    const swipeHint = document.getElementById('swipeHint');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dot0 = document.getElementById('dot0');
    const dot1 = document.getElementById('dot1');

    function updateSlideUI(idx) {
      const p = idx + 1;
      pageLabel.textContent = p === 1
        ? '1 / 2 페이지 (표지 · 핵심 가치) — 좌우로 슬라이드하세요'
        : '2 / 2 페이지 (세부 기술 사양표 · 문의처)';
      swipeHint.textContent = p + ' / 2 · 좌우 슬라이드';
      prevBtn.disabled = (idx === 0);
      nextBtn.disabled = (idx === 1);
      dot0.classList.toggle('active', idx === 0);
      dot1.classList.toggle('active', idx === 1);
    }

    function goSlide(idx) {
      const w = slider.clientWidth;
      slider.scrollTo({ left: idx * w, behavior: 'smooth' });
      updateSlideUI(idx);
    }

    let scrollTimer;
    slider.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const w = slider.clientWidth || 1;
        const idx = Math.round(slider.scrollLeft / w);
        updateSlideUI(idx);
      }, 60);
    }, { passive: true });

    // Desktop mouse drag support
    let isDown = false, startX = 0, startScroll = 0;
    slider.addEventListener('mousedown', e => {
      isDown = true;
      startX = e.pageX;
      startScroll = slider.scrollLeft;
    });
    window.addEventListener('mouseup', () => {
      if (!isDown) return;
      isDown = false;
      const w = slider.clientWidth || 1;
      goSlide(Math.round(slider.scrollLeft / w));
    });
    slider.addEventListener('mousemove', e => {
      if (!isDown) return;
      e.preventDefault();
      slider.scrollLeft = startScroll - (e.pageX - startX);
    });

    function openModal() { document.getElementById('modalBg').classList.add('open'); }
    function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
    function closeConfirmModal() { document.getElementById('confirmModalBg').classList.remove('open'); }

    function triggerPdfDownload() {
      const a = document.createElement('a');
      a.href = 'brochure.pdf';
      a.download = '이테크시스템_AI팩토리_브로슈어_2026빛가람컨퍼런스.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function openConfirmModal(name, org, contact) {
      const hasInfo = Boolean(name || org || contact);
      const titleEl = document.getElementById('confirmTitle');
      const descEl = document.getElementById('confirmDesc');
      const boxEl = document.getElementById('confirmBox');

      if (hasInfo) {
        titleEl.textContent = '접수 및 다운로드 완료';
        descEl.textContent = '입력하신 정보가 정상 접수되었으며, PDF 브로슈어 다운로드가 시작되었습니다.';
        boxEl.style.display = 'block';
        document.getElementById('cfName').textContent = name || '-';
        document.getElementById('cfOrg').textContent = org || '-';
        document.getElementById('cfContact').textContent = contact || '-';
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('cfTime').textContent =
          now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
          pad(now.getHours()) + ':' + pad(now.getMinutes());
      } else {
        titleEl.textContent = '브로슈어 다운로드 완료';
        descEl.textContent = 'PDF 브로슈어 다운로드가 시작되었습니다. 감사합니다.';
        boxEl.style.display = 'none';
      }
      document.getElementById('confirmModalBg').classList.add('open');
    }

    async function submitLead(e) {
      e.preventDefault();
      const btn = document.getElementById('subBtn');
      btn.disabled = true;
      btn.textContent = '처리 중...';

      const name = document.getElementById('vName').value.trim();
      const org = document.getElementById('vOrg').value.trim();
      const contact = document.getElementById('vContact').value.trim();
      const isLocal = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');

      if (name || org || contact) {
        try {
          if (isLocal) {
            await fetch('/api/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, org, contact })
            });
          } else {
            // Submit to Netlify Forms only when visitor entered info
            const formData = new URLSearchParams();
            formData.append('form-name', 'brochure-leads');
            formData.append('name', name);
            formData.append('org', org);
            formData.append('contact', contact);
            await fetch('/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: formData.toString()
            });
          }
        } catch (err) { console.error(err); }
      }

      closeModal();
      btn.disabled = false;
      btn.textContent = 'PDF 브로슈어 바로 다운로드';

      triggerPdfDownload();
      openConfirmModal(name, org, contact);
    }
  </script>
</body>
</html>
